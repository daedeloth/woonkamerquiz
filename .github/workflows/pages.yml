name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No deploy credentials: deploy-pages authenticates with the OIDC token minted
# by id-token, so there is no key to leak or rotate.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The site is served straight from www/, which is also where the CNAME
      # lives -- the custom domain is only kept if it ships in the artifact.
      - name: Upload www/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
